<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PyAscent - Learn Python from print() to pandas</title>
<meta name="description" content="A 30-waypoint Python route. Read the brief, run the drills, clear the checkpoint. Real Python runs in your browser." />
<meta name="theme-color" content="#0E1A24" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
<link rel="stylesheet" href="./styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E1A24'/%3E%3Cpath d='M3 25 L12 10 L17 18 L21 12 L29 25 Z' fill='none' stroke='%23F0B429' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>

<svg class="contours" aria-hidden="true" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice"></svg>

<header class="topbar">
  <button class="rail-toggle" id="railToggle" aria-expanded="false" aria-controls="rail">
    <span class="rail-toggle__bars" aria-hidden="true"></span>
    <span class="sr-only">Show route</span>
  </button>

  <a class="brand" href="#" id="brandHome">
    <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M3 25 L12 10 L17 18 L21 12 L29 25 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    </svg>
    <span class="brand__text">
      <strong>PyAscent</strong>
      <em>Route 2926 &middot; print() to pandas</em>
    </span>
  </a>

  <div class="gauge" id="gauge">
    <div class="gauge__reading">
      <span class="gauge__num" id="gaugeMeters">0</span><span class="gauge__unit">m</span>
      <span class="gauge__of">/ 2926 m</span>
    </div>
    <div class="gauge__track"><div class="gauge__fill" id="gaugeFill"></div></div>
  </div>

  <div class="streak" id="streak" title="Consecutive days with at least one waypoint worked on">
    <span class="streak__flame" aria-hidden="true">▲</span>
    <span class="streak__n" id="streakN">0</span>
    <span class="streak__label">day streak</span>
  </div>

  <button class="ghost-btn" id="resetBtn" type="button">Reset route</button>
</header>

<div class="shell">

  <aside class="rail" id="rail" aria-label="Route">
    <div class="profile">
      <div class="profile__head">
        <span class="eyebrow">Elevation profile</span>
        <span class="profile__stat" id="profileStat">0 / 30 waypoints</span>
      </div>
      <svg class="profile__svg" id="profileSvg" viewBox="0 0 320 96" preserveAspectRatio="none" role="img" aria-label="Ascent profile showing progress across 30 waypoints"></svg>
    </div>

    <nav class="route" id="route"></nav>

    <div class="rail__foot">
      <span class="eyebrow">Badges</span>
      <div class="badges" id="badges"></div>
    </div>
  </aside>

  <main class="stage" id="stage">
    <div class="stage__inner" id="stageInner"></div>
  </main>

</div>

<div class="runtime" id="runtime" data-state="boot">
  <span class="runtime__dot" aria-hidden="true"></span>
  <span class="runtime__text" id="runtimeText">Starting Python...</span>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
